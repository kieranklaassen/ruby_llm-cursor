AllCops:
  TargetRubyVersion: 3.1
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "spec/**/*"

Style/Documentation:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Lint/UnusedMethodArgument:
  Enabled: false
Naming/FileName:
  # Hyphenated require shim is the gem-packaging convention for ruby_llm-cursor.
  Exclude:
    - "lib/ruby_llm-cursor.rb"
Metrics:
  Enabled: false
Layout/LineLength:
  Max: 120
